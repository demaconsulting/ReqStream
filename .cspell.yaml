---
# Spell-Checking
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: '0.2'

language: en

# Project-specific technical terms and tool names
words:
  - buildmark
  - DEMA
  - Dema
  - fileassert
  - hotspot
  - hotspots
  - mstest
  - pandoc
  - Pandoc
  - reqstream
  - reviewmark
  - SARIF
  - Sarif
  - sarifmark
  - sonarmark
  - testname
  - testresults
  - tracematrix
  - xunit
  - Xunit
  - APFS
  - callees
  - NTFS
  - Postconditions
  - RAII
  - unloadable
  - unparseable
  - Unwritable
  - venv
  - versionmark
  - Weasy
  - weasyprint
  - yamlfix
  - yamldotnet

ignorePaths:
  - '**/.git/**'
  - '**/node_modules/**'
  - '**/.venv/**'
  - '**/thirdparty/**'
  - '**/third-party/**'
  - '**/3rd-party/**'
  - '**/.agent-logs/**'
  - '**/bin/**'
  - '**/obj/**'
  - '**/generated/**'
  - package-lock.json
