---
# Spell-Checking
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: "0.2"
language: en

# Project-specific technical terms and tool names
words:
  - antipatterns
  - Antipatterns
  - Blockquotes
  - buildmark
  - BuildMark
  - camelcase
  - CodeQL
  - copilot
  - cspell
  - csproj
  - dcterms
  - DEMA
  - DemaConsulting
  - demaconsulting
  - dependabot
  - Dependabot
  - dotnet
  - editorconfig
  - filepart
  - gitattributes
  - hotspots
  - markdownlint
  - MSTest
  - nameof
  - nuget
  - NuGet
  - nupkg
  - Pandoc
  - pagetitle
  - passwordvalidator
  - reqstream
  - ReqStream
  - reviewmark
  - ReviewMark
  - SARIF
  - SarifMark
  - SBOM
  - slnx
  - snupkg
  - Qube
  - sonarcloud
  - SonarMark
  - testname
  - tracematrix
  - Triaging
  - venv
  - versionmark
  - VersionMark
  - Weasyprint
  - weasyprint
  - xunit
  - YAML
  - yamllint

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - package-lock.json
