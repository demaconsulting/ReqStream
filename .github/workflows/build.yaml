---
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Version number for the build'
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          globs: '**/*.md'

      - name: Spell Check
        uses: streetsidesoftware/cspell-action@v8
        with:
          incremental_files_only: false
          files: |
            **/*.md
            **/*.cs

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yaml

  build:
    name: Build ${{ matrix.os }}
    needs: quality-checks
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Start Sonar Scanner
        run: >
          dotnet sonarscanner begin
          /k:"demaconsulting_ReqStream"
          /o:"demaconsulting"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths=**/*.opencover.xml
          /d:sonar.scanner.scanAll=false

      - name: Build
        run: >
          dotnet build
          --no-restore
          --configuration Release
          --property:Version=${{ inputs.version }}

      - name: Test
        run: >
          dotnet test
          --no-build
          --configuration Release
          --verbosity normal
          --collect "XPlat Code Coverage;Format=opencover"
          --logger "trx;LogFileName=test-results-${{ matrix.os }}.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test/**/TestResults/*.trx

      - name: End Sonar Scanner
        run: >
          dotnet sonarscanner end
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Package
        run: >
          dotnet pack
          --no-build
          --configuration Release
          --property:Version=${{ inputs.version }}

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.os }}
          path: |
            src/DemaConsulting.ReqStream/bin/Release/*.nupkg
            src/DemaConsulting.ReqStream/bin/Release/*.snupkg

  integration-test:
    name: Integration Test ${{ matrix.os }} .NET ${{ matrix.dotnet-version }}
    runs-on: ${{ matrix.os }}
    needs: build
    permissions:
      contents: read

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        dotnet-version: ['8.x', '9.x', '10.x']

    steps:
      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: packages

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Install tool from package
        shell: bash
        run: |
          echo "Installing package version ${{ inputs.version }} from: packages/"
          dotnet tool install --global --add-source packages --version ${{ inputs.version }} DemaConsulting.ReqStream

      - name: Test version command
        shell: bash
        run: |
          echo "Testing version command..."
          reqstream --version || { echo "✗ Version command failed"; exit 1; }
          echo "✓ Version command succeeded"

      - name: Test help command
        shell: bash
        run: |
          echo "Testing help command..."
          reqstream --help || { echo "✗ Help command failed"; exit 1; }
          echo "✓ Help command succeeded"

      - name: Test self-validation
        shell: bash
        run: |
          echo "Testing self-validation..."
          reqstream --validate || { echo "✗ Self-validation failed"; exit 1; }
          echo "✓ Self-validation succeeded"

      - name: Test self-validation with results output
        shell: bash
        run: |
          echo "Testing self-validation with TRX results output..."
          # Create a unique filename with OS and dotnet version
          OS_NAME="${{ matrix.os }}"
          DOTNET_VERSION="${{ matrix.dotnet-version }}"
          TRX_FILE="integration-test-${OS_NAME}-dotnet${DOTNET_VERSION}.trx"
          reqstream --validate --results "$TRX_FILE" || {
            echo "✗ Self-validation with results failed"
            exit 1
          }
          [ -f "$TRX_FILE" ] || { echo "✗ Results file not created"; exit 1; }
          echo "✓ Self-validation with results succeeded"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-results-${{ matrix.os }}-dotnet${{ matrix.dotnet-version }}
          path: integration-test-*.trx

  codeql:
    name: CodeQL Analysis
    needs: quality-checks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality
          config-file: ./.github/codeql-config.yml
          build-mode: manual

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --no-restore
          --configuration Release
          --property:Version=${{ inputs.version }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
          output: sarif-results
          upload: false

      - name: Upload SARIF
        uses: actions/upload-artifact@v6
        with:
          name: codeql-sarif
          path: sarif-results/csharp.sarif

  build-docs:
    name: Build Documentation
    runs-on: windows-latest
    needs: [build, integration-test, codeql]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all test results
        uses: actions/download-artifact@v7
        with:
          path: test-results
          pattern: '*test-results*'
        continue-on-error: true

      - name: Download integration test results
        uses: actions/download-artifact@v7
        with:
          path: test-results
          pattern: 'integration-test-results-*'
        continue-on-error: true

      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: packages-windows-latest
          path: packages

      - name: Download CodeQL SARIF
        uses: actions/download-artifact@v7
        with:
          name: codeql-sarif
          path: codeql-results

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Install npm dependencies
        run: npm install

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Install ReqStream from build
        run: |
          echo "Installing ReqStream version ${{ inputs.version }} from build..."
          dotnet tool install --global --add-source packages --version ${{ inputs.version }} DemaConsulting.ReqStream

      - name: Generate Requirements Documentation
        run: >
          reqstream
          --requirements requirements.yaml
          --tests "test-results/**/*.trx"
          --report docs/requirements/requirements.md
          --matrix docs/tracematrix/tracematrix.md
          --justifications docs/justifications/justifications.md
          --enforce

      - name: Generate HTML with Pandoc
        run: >
          dotnet pandoc
          --defaults docs/guide/definition.yaml
          --filter node_modules/.bin/mermaid-filter.cmd
          --output docs/guide/guide.html

      - name: Generate PDF with Weasyprint
        run: >
          dotnet weasyprint
          --pdf-variant pdf/a-3u
          docs/guide/guide.html
          "docs/ReqStream User Guide.pdf"

      - name: Generate Requirements HTML with Pandoc
        run: >
          dotnet pandoc
          --defaults docs/requirements/definition.yaml
          --output docs/requirements/requirements.html

      - name: Generate Requirements PDF with Weasyprint
        run: >
          dotnet weasyprint
          --pdf-variant pdf/a-3u
          docs/requirements/requirements.html
          "docs/ReqStream Requirements.pdf"

      - name: Generate Trace Matrix HTML with Pandoc
        run: >
          dotnet pandoc
          --defaults docs/tracematrix/definition.yaml
          --output docs/tracematrix/tracematrix.html

      - name: Generate Trace Matrix PDF with Weasyprint
        run: >
          dotnet weasyprint
          --pdf-variant pdf/a-3u
          docs/tracematrix/tracematrix.html
          "docs/ReqStream Trace Matrix.pdf"

      - name: Generate Justifications HTML with Pandoc
        run: >
          dotnet pandoc
          --defaults docs/justifications/definition.yaml
          --output docs/justifications/justifications.html

      - name: Generate Justifications PDF with Weasyprint
        run: >
          dotnet weasyprint
          --pdf-variant pdf/a-3u
          docs/justifications/justifications.html
          "docs/ReqStream Requirements Justifications.pdf"

      - name: Generate CodeQL Quality Report with SarifMark
        shell: pwsh
        run: >
          dotnet sarifmark
          --sarif codeql-results/csharp.sarif
          --report docs/quality/codeql-quality.md
          --heading "ReqStream CodeQL Analysis"
          --report-depth 1

      - name: Display CodeQL Quality Report
        shell: pwsh
        run: |
          echo "=== CodeQL Quality Report ==="
          Get-Content docs/quality/codeql-quality.md

      - name: Generate Code Quality Report with SonarMark
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarmark
          --server https://sonarcloud.io
          --project-key demaconsulting_ReqStream
          --branch ${{ github.ref_name }}
          --token "$env:SONAR_TOKEN"
          --report docs/quality/sonar-quality.md
          --report-depth 1

      - name: Display SonarCloud Quality Report
        shell: pwsh
        run: |
          echo "=== SonarCloud Quality Report ==="
          Get-Content docs/quality/sonar-quality.md

      - name: Generate Code Quality HTML with Pandoc
        run: >
          dotnet pandoc
          --defaults docs/quality/definition.yaml
          --output docs/quality/quality.html

      - name: Generate Code Quality PDF with Weasyprint
        run: >
          dotnet weasyprint
          --pdf-variant pdf/a-3u
          docs/quality/quality.html
          "docs/ReqStream Code Quality.pdf"

      - name: Generate Build Notes with BuildMark
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: >
          dotnet buildmark
          --build-version ${{ inputs.version }}
          --report docs/buildnotes.md
          --report-depth 1

      - name: Display Build Notes Report
        shell: bash
        run: |
          echo "=== Build Notes Report ==="
          cat docs/buildnotes.md

      - name: Generate Build Notes HTML with Pandoc
        shell: bash
        run: >
          dotnet pandoc
          --defaults docs/buildnotes/definition.yaml
          --filter node_modules/.bin/mermaid-filter.cmd
          --output docs/buildnotes/buildnotes.html

      - name: Generate Build Notes PDF with Weasyprint
        run: >
          dotnet weasyprint
          --pdf-variant pdf/a-3u
          docs/buildnotes/buildnotes.html
          "docs/ReqStream Build Notes.pdf"

      - name: Upload documentation
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: |
            docs/*.pdf
            docs/buildnotes.md
