---
name: Build

on:
  workflow_call:
    inputs:
      os:
        description: 'Operating system to run on'
        required: true
        type: string
      version:
        description: 'Version number for the build'
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud token'
        required: true

jobs:
  build:
    runs-on: ${{ inputs.os }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Start Sonar Scanner
        run: >
          dotnet sonarscanner begin
          /k:"demaconsulting_ReqStream"
          /o:"demaconsulting"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths=**/*.opencover.xml
          /d:sonar.scanner.scanAll=false

      - name: Build
        run: >
          dotnet build
          --no-restore
          --configuration Release
          --property:Version=${{ inputs.version }}

      - name: Test
        run: >
          dotnet test
          --no-build
          --configuration Release
          --verbosity normal
          --collect "XPlat Code Coverage;Format=opencover"

      - name: End Sonar Scanner
        run: >
          dotnet sonarscanner end
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Package
        run: >
          dotnet pack
          --no-build
          --configuration Release
          --property:Version=${{ inputs.version }}

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ inputs.os }}
          path: |
            src/DemaConsulting.ReqStream/bin/Release/*.nupkg
            src/DemaConsulting.ReqStream/bin/Release/*.snupkg

  integration-test:
    runs-on: ${{ inputs.os }}
    needs: build
    permissions:
      contents: read

    strategy:
      matrix:
        dotnet-version: ['8.x', '9.x', '10.x']

    steps:
      - name: Download package
        uses: actions/download-artifact@v6
        with:
          name: packages-${{ inputs.os }}
          path: packages

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Install tool from package
        shell: bash
        run: |
          echo "Installing package version ${{ inputs.version }} from: packages/"
          dotnet tool install --global --add-source packages --version ${{ inputs.version }} DemaConsulting.ReqStream

      - name: Test version command
        shell: bash
        run: |
          echo "Testing version command..."
          reqstream --version || { echo "✗ Version command failed"; exit 1; }
          echo "✓ Version command succeeded"

      - name: Test help command
        shell: bash
        run: |
          echo "Testing help command..."
          reqstream --help || { echo "✗ Help command failed"; exit 1; }
          echo "✓ Help command succeeded"
