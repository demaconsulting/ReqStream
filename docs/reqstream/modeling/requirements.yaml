---
sections:
  - title: ReqStream Requirements
    sections:
      - title: Modeling
        requirements:
          - id: ReqStream-Req-YamlProcessing
            title: The tool shall process YAML requirements files.
            justification: |
              YAML provides a human-readable, version-control-friendly format for managing requirements.
              This makes requirements accessible to both technical and non-technical stakeholders.
            tags:
              - requirements
            tests:
              - Requirements_Load_SimpleRequirement_ParsesCorrectly
              - Program_Run_WithRequirementsFiles_ProcessesSuccessfully
              - Requirements_Load_ComplexStructure_ParsesCorrectly

          - id: ReqStream-Req-Validation
            title: The tool shall validate requirements file structure.
            justification: |
              Early validation prevents runtime errors and ensures requirements data integrity, catching
              issues before they impact downstream processes.
            tags:
              - requirements
            tests:
              - Requirements_Load_BlankSectionTitle_ThrowsExceptionWithFileLocation
              - Requirements_Load_BlankRequirementId_ThrowsExceptionWithFileLocation
              - Requirements_Load_BlankRequirementTitle_ThrowsExceptionWithFileLocation
              - Requirements_Load_DuplicateRequirementId_ThrowsException
              - Requirements_Load_DuplicateRequirementId_ExceptionIncludesFileLocation

          - id: ReqStream-Req-YamlErrorReporting
            title: The tool shall report YAML deserialization errors with the filename and location.
            justification: |
              Clear error messages including the filename and line/column position allow users to quickly
              locate and fix issues in their requirements files without decoding internal type information.
            tags:
              - requirements
            tests:
              - Requirements_Load_InvalidYamlContent_ThrowsExceptionWithFileLocation

          - id: ReqStream-Req-Hierarchy
            title: The tool shall support hierarchical sections and subsections.
            justification: |
              Hierarchical organization allows requirements to be grouped logically by system components,
              features, or concerns, improving maintainability and navigation.
            tags:
              - requirements
            tests:
              - Requirements_Load_NestedSections_ParsesHierarchyCorrectly
              - Requirements_Export_NestedSections_CreatesHierarchy

          - id: ReqStream-Req-Includes
            title: The tool shall support file includes in requirements files.
            justification: |
              File includes enable modular requirements management, allowing teams to organize requirements
              across multiple files and reducing merge conflicts in version control.
            tags:
              - requirements
            tests:
              - Requirements_Load_WithIncludes_MergesFilesCorrectly
              - Requirements_Load_MultipleFiles_MergesAllFiles
              - Requirements_Load_IncludeLoop_DoesNotCauseInfiniteLoop

          - id: ReqStream-Req-SectionMerging
            title: The tool shall merge sections with the same hierarchy path.
            justification: |
              Section merging allows multiple files to contribute to the same logical section, supporting
              distributed authoring and modular organization of requirements.
            tags:
              - requirements
            tests:
              - Requirements_Load_IdenticalSections_MergesCorrectly
              - Requirements_Load_MultipleFilesWithSameSections_MergesSections

      - title: Requirements Definition
        requirements:
          - id: ReqStream-Req-UniqueIds
            title: The tool shall require each requirement to have a unique identifier.
            justification: |
              Unique identifiers enable unambiguous referencing of requirements in documentation, test
              mappings, and traceability reports.
            tags:
              - requirements
            tests:
              - Requirements_Load_DuplicateRequirementId_ThrowsException
              - Requirements_Load_BlankRequirementId_ThrowsExceptionWithFileLocation
              - Requirements_Load_MultipleFilesWithDuplicateIds_ThrowsException

          - id: ReqStream-Req-RequiredTitle
            title: The tool shall require each requirement to have a title.
            justification: |
              Titles provide human-readable descriptions of requirements, making them understandable to
              stakeholders without needing to reference external documentation.
            tags:
              - requirements
            tests:
              - Requirements_Load_BlankRequirementTitle_ThrowsExceptionWithFileLocation

          - id: ReqStream-Req-ParentChild
            title: The tool shall support parent-child relationships between requirements.
            justification: |
              Parent-child relationships enable hierarchical requirement decomposition, allowing high-level
              requirements to be satisfied through lower-level requirements.
            tags:
              - requirements
            tests:
              - Requirements_Load_RequirementWithChildren_ParsesChildrenCorrectly
              - TraceMatrix_Export_WithChildRequirements_ConsidersChildTests

          - id: ReqStream-Req-TestMappings
            title: The tool shall support test mappings for requirements.
            justification: |
              Test mappings establish traceability between requirements and tests, enabling verification
              that requirements are adequately tested and satisfied.
            tags:
              - requirements
            tests:
              - Requirements_Load_RequirementWithTests_ParsesTestsCorrectly
              - Requirements_Load_BlankTestNameInRequirement_ThrowsExceptionWithFileLocation
              - Requirements_Load_TestMappings_AppliesMappingsCorrectly
              - Requirements_Load_BlankTestNameInMapping_ThrowsExceptionWithFileLocation
              - Requirements_Load_BlankMappingId_ThrowsExceptionWithFileLocation

          - id: ReqStream-Req-UnifiedLoad
            title: >-
              The tool shall provide a unified load mechanism that simultaneously builds the requirements model and
              reports lint issues from a single YAML DOM tree walk.
            justification: |
              A single YAML DOM tree walk eliminates the drift that can occur between separate linting
              and loading implementations. Load failures automatically produce detailed lint-issue output,
              and the caller receives both the nullable requirements model and a complete list of issues
              in one operation.
            tags:
              - requirements
            tests:
              - Requirements_Load_ValidFile_ReturnsRequirementsAndNoIssues
              - Requirements_Load_WithLintError_ReturnsNullAndIssues
              - Requirements_Load_MissingFile_ReturnsNullAndIssues
              - Requirements_Load_MalformedYaml_ReturnsNullAndIssues
              - Requirements_Load_WithMultipleLintErrors_ReportsAllIssues
              - Requirements_Load_WithIncludes_LintsIncludedFiles
              - LintIssue_ToString_FormatsCorrectly
              - Requirements_Load_WithLintError_IssueIncludesLocation
      - title: Requirements Loading
        requirements:
          - id: ReqStream-Lint-MalformedYaml
            title: The requirements loader shall report an error when a requirements file contains malformed YAML.
            justification: |
              Malformed YAML files cannot be parsed and prevent requirements from being loaded.
              Reporting the error with a file location helps users identify and fix the syntax problem.
            tags:
              - lint
            tests:
              - Linter_Lint_WithMalformedYaml_ReportsError

          - id: ReqStream-Lint-UnknownDocumentField
            title: >-
              The requirements loader shall report an error when the requirements document contains an unknown
              field.
            justification: |
              Unknown fields may indicate typos or outdated configuration that would otherwise be silently
              ignored, leading to unexpected behavior.
            tags:
              - lint
            tests:
              - Linter_Lint_WithUnknownDocumentField_ReportsError

          - id: ReqStream-Lint-UnknownSectionField
            title: The requirements loader shall report an error when a section contains an unknown field.
            justification: |
              Unknown fields in sections may indicate typos or unsupported configuration that would otherwise
              be silently ignored.
            tags:
              - lint
            tests:
              - Linter_Lint_WithUnknownSectionField_ReportsError

          - id: ReqStream-Lint-MissingSectionTitle
            title: The requirements loader shall report an error when a section is missing the required title field.
            justification: |
              The title field is mandatory for all sections. Missing it prevents the section from being
              correctly identified in reports and trace matrices.
            tags:
              - lint
            tests:
              - Linter_Lint_WithSectionMissingTitle_ReportsError
              - Linter_Lint_WithBlankSectionTitle_ReportsError

          - id: ReqStream-Lint-UnknownRequirementField
            title: The requirements loader shall report an error when a requirement contains an unknown field.
            justification: |
              Unknown fields in requirements may indicate typos or unsupported attributes that would otherwise
              be silently ignored.
            tags:
              - lint
            tests:
              - Linter_Lint_WithUnknownRequirementField_ReportsError
              - Linter_Lint_WithNestedSectionIssues_ReportsError

          - id: ReqStream-Lint-MissingRequirementFields
            title: >-
              The requirements loader shall report an error when a requirement is missing or has a blank id or
              title field.
            justification: |
              The id and title fields are mandatory for all requirements. Missing or blank values cause downstream
              processing failures and produce incomplete reports.
            tags:
              - lint
            tests:
              - Linter_Lint_WithRequirementMissingId_ReportsError
              - Linter_Lint_WithRequirementMissingTitle_ReportsError
              - Linter_Lint_WithBlankRequirementId_ReportsError
              - Linter_Lint_WithBlankRequirementTitle_ReportsError

          - id: ReqStream-Lint-DuplicateIds
            title: The requirements loader shall report an error when duplicate requirement IDs are found.
            justification: |
              Duplicate requirement IDs cause ambiguity in trace matrices and reports, and can lead to
              incorrect coverage calculations.
            tags:
              - lint
            tests:
              - Linter_Lint_WithDuplicateIds_ReportsError
              - Linter_Lint_WithDuplicateIdsAcrossFiles_ReportsError

          - id: ReqStream-Lint-MultipleIssues
            title: The requirements loader shall report all issues found rather than stopping at the first issue.
            justification: |
              Reporting all issues at once allows users to fix all problems in a single pass, which is more
              efficient than fixing one issue at a time and re-running.
            tags:
              - lint
            tests:
              - Linter_Lint_WithMultipleIssues_ReportsAllIssues

          - id: ReqStream-Lint-FollowsIncludes
            title: The requirements loader shall follow include directives and load all included files.
            justification: |
              Requirements files can include other files. Loading must follow these includes to ensure all
              referenced files are also checked for issues.
            tags:
              - lint
            tests:
              - Linter_Lint_WithIncludes_LintsIncludedFiles

          - id: ReqStream-Lint-NoIssuesMessage
            title: The requirements loader shall report a no-issues result when no problems are found.
            justification: |
              Reporting success when no issues are found provides positive confirmation to the user
              that the requirements files passed all checks.
            tags:
              - lint
            tests:
              - Linter_Lint_WithValidFile_ReportsNoIssues
              - Linter_Lint_WithEmptyFile_ReportsNoIssues

          - id: ReqStream-Lint-ErrorFormat
            title: "The requirements loader shall format errors as \"[location]: [severity]: [description]\"."
            justification: |
              Standard output format with file path and location information allows editors and CI tools
              to parse the output and navigate directly to the reported issue.
            tags:
              - lint
            tests:
              - Linter_Lint_ErrorFormat_IncludesFileAndLocation

          - id: ReqStream-Lint-UnknownMappingField
            title: The requirements loader shall report an error when a test mapping contains an unknown field.
            justification: |
              Unknown fields in test mappings may indicate typos or unsupported configuration that would
              otherwise be silently ignored.
            tags:
              - lint
            tests:
              - Linter_Lint_WithUnknownMappingField_ReportsError

          - id: ReqStream-Lint-MissingMappingId
            title: The requirements loader shall report an error when a test mapping is missing or has a blank id field.
            justification: |
              The id field is mandatory for all test mappings. Missing or blank values prevent the mapping
              from being associated with a requirement and cause downstream processing failures.
            tags:
              - lint
            tests:
              - Linter_Lint_WithMappingMissingId_ReportsError
              - Linter_Lint_WithBlankMappingId_ReportsError

          - id: ReqStream-Lint-BlankTestName
            title: The requirements loader shall report an error when a test name in a requirement or mapping is blank.
            justification: |
              Blank test names cannot be matched against test result files and would silently break
              coverage calculations.
            tags:
              - lint
            tests:
              - Linter_Lint_WithBlankTestName_ReportsError
              - Linter_Lint_WithBlankMappingTestName_ReportsError

          - id: ReqStream-Lint-BlankTagName
            title: The requirements loader shall report an error when a tag name in a requirement is blank.
            justification: |
              Blank tag names cannot be used for filtering and would silently produce incorrect filtered
              exports.
            tags:
              - lint
            tests:
              - Linter_Lint_WithBlankTagName_ReportsError

          - id: ReqStream-Lint-IssueType
            title: The requirements loader shall represent each issue with a location, severity, and description.
            justification: |
              A structured issue type allows callers to programmatically inspect and report lint issues,
              supporting both human-readable output and tooling integration.
            tags:
              - lint
            tests:
              - LintIssue_ToString_FormatsCorrectly

          - id: ReqStream-Lint-NonScalarListEntries
            title: >-
              The requirements loader shall report an error when a list field contains a non-scalar entry.
            justification: |
              List fields such as tests, children, tags, and includes must contain scalar string values.
              Non-scalar entries (e.g. nested mappings) would be silently ignored without this check,
              leading to missing coverage or include entries.
            tags:
              - lint
            tests:
              - Linter_Lint_WithNonScalarTestEntry_ReportsError
              - Linter_Lint_WithNonScalarChildEntry_ReportsError
              - Linter_Lint_WithNonScalarTagEntry_ReportsError
              - Linter_Lint_WithNonScalarMappingTestEntry_ReportsError
              - Linter_Lint_WithNonScalarIncludeEntry_ReportsError

          - id: ReqStream-Lint-CircularReferences
            title: >-
              The requirements loader shall report an error when circular references are detected in the
              requirement children graph.
            justification: |
              Circular requirement references would cause infinite loops during trace matrix generation.
              All back-edges in the children graph must be reported, not just the first one found.
            tags:
              - lint
            tests:
              - Linter_Lint_WithMultipleCycles_ReportsAllCycles

          - id: ReqStream-Lint-UnknownChildReference
            title: >-
              The requirements loader shall report an error when a requirement references a child
              requirement ID that does not exist.
            justification: |
              References to non-existent child requirement IDs indicate typos or stale references.
              Reporting these as errors ensures that requirement hierarchies remain consistent and
              prevents silent failures in trace matrix generation.
            tags:
              - lint
            tests:
              - Linter_Lint_WithUnknownChildReference_ReportsError
