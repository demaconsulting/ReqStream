---
# Section unit requirements
sections:
  - title: ReqStream Requirements
    sections:
      - title: Modeling Requirements
        sections:
          - title: Section Requirements
            requirements:
              - id: ReqStream-Section-Title
                title: Section shall hold a title identifying the section.
                justification: |
                  The title is the primary identity of a section: it is displayed in generated reports
                  and used as the merge key by RequirementsLoader to locate existing sections when
                  loading requirements from multiple YAML files.
                tags: [requirements]
                tests:
                  - Section_Load_SimpleRequirement_ParsesCorrectly
                  - Section_Load_NestedSections_ParsesHierarchyCorrectly

              - id: ReqStream-Section-RequirementsList
                title: Section shall hold a list of requirements.
                justification: |
                  Requirements are the content payload of a section. Holding them in a list enables
                  enumeration for reporting, tracing, and linting without imposing an ordering
                  constraint on consumers.
                tags: [requirements]
                tests:
                  - Section_Load_SimpleRequirement_ParsesCorrectly

              - id: ReqStream-Section-ChildSections
                title: Section shall hold a list of child sections.
                justification: |
                  Child sections enable the hierarchical tree structure required for grouping
                  requirements by system components, features, or concerns. Holding children in a
                  list allows RequirementsLoader to traverse and merge the full requirements tree.
                tags: [requirements]
                tests:
                  - Section_Load_NestedSections_ParsesHierarchyCorrectly

              - id: ReqStream-Section-Nesting
                title: Section shall support nested child sections for hierarchical organization.
                justification: |
                  Hierarchical organization allows requirements to be grouped logically by system
                  components, features, or concerns, improving maintainability and navigation.
                tags: [requirements]
                tests:
                  - Section_Load_NestedSections_ParsesHierarchyCorrectly
                  - Requirements_Export_NestedSections_CreatesHierarchy

              - id: ReqStream-Section-TitleMerging
                title: >-
                  Section shall be identified by its title for merging when multiple files contribute
                  to the same hierarchical path.
                justification: |
                  Title-based identity is the observable invariant that enables modular requirements
                  management: RequirementsLoader uses the title to decide whether to reuse an existing
                  Section or create a new one. Section is responsible for exposing its Title as a
                  stable identity key.
                tags: [requirements]
                tests:
                  - Requirements_Load_IdenticalSections_MergesCorrectly
