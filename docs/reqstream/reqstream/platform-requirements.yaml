# Source Filter Prefixes for Platform and Framework Requirements
#
# Test links can include a source filter prefix to restrict which test results count
# as evidence for a requirement. This is critical for platform and framework
# requirements - removing these filters invalidates the evidence-based proof.
#
# Source filter prefixes:
#   windows@TestName    - proves the test passed on a Windows platform
#   ubuntu@TestName     - proves the test passed on a Linux (Ubuntu) platform
#   macos@TestName      - proves the test passed on a macOS platform
#   net8.0@TestName     - proves the test passed under the .NET 8 target framework
#   net9.0@TestName     - proves the test passed under the .NET 9 target framework
#   net10.0@TestName    - proves the test passed under the .NET 10 target framework
#   dotnet8.x@TestName  - proves the self-validation test ran with .NET 8.x runtime
#   dotnet9.x@TestName  - proves the self-validation test ran with .NET 9.x runtime
#   dotnet10.x@TestName - proves the self-validation test ran with .NET 10.x runtime
#
# NOTE: Running "reqstream --enforce" with only local test results (unit tests
# and local self-validation) is expected to show some unsatisfied requirements.
# Platform-specific requirements require test results from CI/CD runs across
# the full OS and runtime matrix.
#
---
sections:
  - title: ReqStream Requirements
    sections:
      - title: Platform Support
        requirements:
          - id: ReqStream-Platform-Windows
            title: The tool shall run on Windows operating systems.
            justification: |
              Windows support is essential for .NET developers who primarily work in Windows environments
              and use Visual Studio.
            tags:
              - platform
            tests:
              - "windows@ReqStream_RequirementsProcessing"
              - "windows@ReqStream_TraceMatrix"
              - "windows@ReqStream_ReportExport"
              - "windows@ReqStream_TagsFiltering"
              - "windows@ReqStream_EnforcementMode"
              - "windows@ReqStream_Lint"

          - id: ReqStream-Platform-Linux
            title: The tool shall run on Linux operating systems.
            justification: |
              Linux support enables use in containerized CI/CD environments and cloud-based build systems
              that typically use Linux.
            tags:
              - platform
            tests:
              - "ubuntu@ReqStream_RequirementsProcessing"
              - "ubuntu@ReqStream_TraceMatrix"
              - "ubuntu@ReqStream_ReportExport"
              - "ubuntu@ReqStream_TagsFiltering"
              - "ubuntu@ReqStream_EnforcementMode"
              - "ubuntu@ReqStream_Lint"

          - id: ReqStream-Platform-MacOS
            title: The tool shall run on macOS operating systems.
            justification: |
              macOS support is essential for developers using Apple platforms who need to run
              ReqStream locally and in CI/CD pipelines on macOS agents.
            tags:
              - platform
            tests:
              - "macos@ReqStream_RequirementsProcessing"
              - "macos@ReqStream_TraceMatrix"
              - "macos@ReqStream_ReportExport"
              - "macos@ReqStream_TagsFiltering"
              - "macos@ReqStream_EnforcementMode"
              - "macos@ReqStream_Lint"

          - id: ReqStream-Platform-Net8
            title: The tool shall support .NET 8.0 runtime.
            justification: |
              .NET 8.0 is an LTS release, providing long-term stability and support for enterprise users.
            tags:
              - platform
            tests:
              - "dotnet8.x@ReqStream_RequirementsProcessing"
              - "dotnet8.x@ReqStream_TraceMatrix"
              - "dotnet8.x@ReqStream_ReportExport"
              - "dotnet8.x@ReqStream_TagsFiltering"
              - "dotnet8.x@ReqStream_EnforcementMode"
              - "dotnet8.x@ReqStream_Lint"

          - id: ReqStream-Platform-Net9
            title: The tool shall support .NET 9.0 runtime.
            justification: |
              .NET 9.0 support enables users to leverage the latest .NET features and performance
              improvements.
            tags:
              - platform
            tests:
              - "dotnet9.x@ReqStream_RequirementsProcessing"
              - "dotnet9.x@ReqStream_TraceMatrix"
              - "dotnet9.x@ReqStream_ReportExport"
              - "dotnet9.x@ReqStream_TagsFiltering"
              - "dotnet9.x@ReqStream_EnforcementMode"
              - "dotnet9.x@ReqStream_Lint"

          - id: ReqStream-Platform-Net10
            title: The tool shall support .NET 10.0 runtime.
            justification: |
              .NET 10.0 support ensures the tool remains compatible with the latest .NET ecosystem and
              future-proofs the project.
            tags:
              - platform
            tests:
              - "dotnet10.x@ReqStream_RequirementsProcessing"
              - "dotnet10.x@ReqStream_TraceMatrix"
              - "dotnet10.x@ReqStream_ReportExport"
              - "dotnet10.x@ReqStream_TagsFiltering"
              - "dotnet10.x@ReqStream_EnforcementMode"
              - "dotnet10.x@ReqStream_Lint"
