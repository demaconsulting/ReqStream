---
# Cli Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the ReqStream Cli subsystem
# - The Cli subsystem spans Context.cs (command-line argument parsing and I/O)
# - Subsystem requirements describe the externally visible command-line interface behavior

sections:
  - title: Cli Subsystem Requirements
    requirements:
      - id: ReqStream-Cli-Interface
        title: The Cli subsystem shall provide a command-line interface for the tool.
        justification: |
          A CLI interface enables automation in CI/CD pipelines and allows integration with scripts
          and build processes. This is essential for the tool's primary use case.
        tests:
          - Cli_Interface_VersionFlag_SetsVersionProperty
          - Cli_Interface_HelpFlag_SetsHelpProperty
          - Cli_Interface_UnknownArgument_ThrowsArgumentException
        children:
          - ReqStream-Command-Cli
          - ReqStream-Command-Version
          - ReqStream-Command-Help
          - ReqStream-Command-InvalidArgs
          - ReqStream-Command-Lint
          - ReqStream-Command-Validate
          - ReqStream-Command-Results
          - ReqStream-Command-Enforce
          - ReqStream-Requirements-GlobPatterns
          - ReqStream-Requirements-TestGlobPatterns
          - ReqStream-Command-Report
          - ReqStream-Command-ReportDepth
          - ReqStream-Command-Matrix
          - ReqStream-Command-MatrixDepth
          - ReqStream-Command-Justifications
          - ReqStream-Command-JustificationsDepth
          - ReqStream-Command-Depth
          - ReqStream-Command-TagFilter

      - id: ReqStream-Cli-Output
        title: The Cli subsystem shall provide output channels to write messages to the console and optional log file.
        justification: |
          Centralized output routing ensures consistent formatting and allows output to be
          suppressed or redirected to a log file as needed.
        tests:
          - Cli_Output_SilentFlag_SetsSilentProperty
          - Cli_Output_LogFlag_WritesOutputToLogFile
        children:
          - ReqStream-Command-Silent
          - ReqStream-Logging-FileOutput

      - id: ReqStream-Cli-ErrorReporting
        title: The Cli subsystem shall provide an error reporting channel that routes errors to stderr and signals failure
          via exit code.
        justification: |
          A dedicated error reporting channel ensures error messages remain visible to the user
          without polluting stdout, and that callers can detect failure conditions by inspecting
          the process exit code.
        tests:
          - Cli_Output_WriteError_WritesToErrorChannel
          - Cli_Output_WriteError_SetsExitCodeToOne
        children:
          - ReqStream-Command-ErrorOutput
          - ReqStream-Command-ExitCode
