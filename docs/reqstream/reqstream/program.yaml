---
# Program subsystem requirements
sections:
  - title: ReqStream Requirements
    sections:
      - title: Program Requirements
        requirements:
          - id: ReqStream-Program-Version
            title: The tool shall print version information and exit when the version flag is provided.
            justification: |
              Printing version information and exiting immediately allows callers to query the installed
              version without triggering any other processing, supporting scripted compatibility checks.
            tags: [cli]
            tests:
              - Program_Run_WithVersionFlag_PrintsVersion

          - id: ReqStream-Program-Help
            title: The tool shall print usage help and exit when the help flag is provided.
            justification: |
              Printing usage help and exiting immediately gives users quick access to command-line
              options without requiring separate documentation or triggering unintended processing.
            tags: [cli]
            tests:
              - Program_Run_WithHelpFlag_PrintsHelp

          - id: ReqStream-Program-Banner
            title: >-
              The tool shall display its name and version on startup for non-lint invocations.
            justification: |
              Displaying the tool name and version on startup provides a visible record of which
              version was used in each run, supporting compliance traceability and troubleshooting.
              The banner is suppressed during lint runs so that build pipelines and editors that
              parse lint output receive only actionable issue lines.
            tags: [cli]
            tests:
              - Program_Run_WithHelpFlag_PrintsHelp
              - Program_Run_WithLintFlag_SuppressesBanner

          - id: ReqStream-Program-Validate
            title: The tool shall run self-validation when the validate flag is provided.
            justification: |
              Self-validation allows the tool to test its own behavior in the target environment,
              providing confidence that the installation is correct and the tool operates as expected.
            tags: [cli]
            tests:
              - Program_Run_WithValidateFlag_RunsValidation
              - Program_Run_WithValidateAndResults_WritesResultsFile

          - id: ReqStream-Program-Requirements
            title: The tool shall load and process requirements files when invoked without special flags.
            justification: |
              Loading and processing requirements files is the primary function of the tool, enabling
              generation of reports and trace matrices from structured requirements data.
            tags: [requirements]
            tests:
              - Program_Run_WithNoRequirementsFiles_ShowsMessage
              - Program_Run_WithRequirementsFiles_ProcessesSuccessfully
              - Program_Run_WithRequirementsExport_GeneratesReport
              - Program_Run_WithTraceMatrixExport_GeneratesMatrix
              - Program_Run_WithJustificationsExport_GeneratesJustificationsReport

          - id: ReqStream-Program-Enforce
            title: The tool shall enforce requirements coverage and fail when requirements are unsatisfied.
            justification: |
              Enforcement prevents unverified requirements from passing silently through a CI/CD pipeline,
              ensuring that every requirement is backed by at least one passing test before a build succeeds.
            tags: [requirements]
            tests:
              - Program_Run_WithEnforcementAndFullySatisfiedRequirements_Succeeds
              - Program_Run_WithEnforcementAndUnsatisfiedRequirements_Fails
              - Program_Run_WithEnforcementAndNoTests_Fails
              - Program_Run_WithEnforcementAndFailedTests_Fails

          - id: ReqStream-Program-Lint
            title: The tool shall lint requirements files and report all issues when the lint flag is provided.
            justification: |
              Linting requirements files allows users to identify structural problems such as malformed YAML,
              missing mandatory fields, unknown fields, and duplicate requirement IDs before processing,
              improving the quality and reliability of requirement definitions.
            tags: [cli, requirements]
            tests:
              - Program_Run_WithLintFlag_RunsLinter
              - Program_Run_WithLintFlag_OnlyOutputsIssues

          - id: ReqStream-Program-LintNoBanner
            title: The tool shall suppress the application banner when the lint flag is provided.
            justification: |
              Suppressing the banner during lint allows lint scripts to treat silence as success
              and only inspect reported issue lines, simplifying integration into build pipelines
              and editors that parse tool output.
            tags: [cli]
            tests:
              - Program_Run_WithLintFlag_SuppressesBanner

          - id: ReqStream-Program-LintVerbosity
            title: The tool shall produce no output when linting is requested and no issues are found.
            justification: |
              Producing no output when linting finds no issues allows build pipelines and scripts
              to treat silence as success without needing to parse a "No issues found" summary.
            tags: [cli]
            tests:
              - Program_Run_WithLintFlag_RunsLinter
              - Program_Run_WithLintFlag_SuppressesBanner

          - id: ReqStream-Program-LintFailure
            title: The tool shall exit with a non-zero exit code when linting detects any issues.
            justification: |
              Exiting with a non-zero exit code when lint finds issues allows build pipelines
              and scripts to detect and report requirements quality problems, preventing
              malformed requirements from silently entering the codebase.
            tags: [cli, requirements]
            tests:
              - Program_Run_WithLintFlag_OnlyOutputsIssues

          - id: ReqStream-Program-MatrixNoTests
            title: >-
              The tool shall report an error and exit with a non-zero code when
              --matrix is requested but no test files are provided.
            justification: |
              Reporting an error when --matrix is requested but no test files are available
              prevents silent no-op runs that produce no matrix file and no diagnostic,
              giving users actionable feedback to correct their invocation.
            tags: [cli, requirements]
            tests:
              - Program_Run_WithMatrixButNoTestFiles_ReportsError
              - Program_Run_WithMatrixAndUnmatchedTestsPattern_ReportsError

          - id: ReqStream-Program-LintNoFiles
            title: >-
              The tool shall report an informational message and exit when linting is
              requested without specifying any requirements files.
            justification: |
              Reporting a clear message when the lint flag is used without any --requirements
              arguments prevents silent no-op runs and provides actionable feedback to users
              who may have forgotten to specify the requirements files to lint.
            tags: [cli, requirements]
            tests:
              - Program_Run_WithLintAndNoRequirements_PrintsInformationalMessage

          - id: ReqStream-Program-OrphanWarning
            title: >-
              The tool shall print a warning listing orphaned requirements, without affecting
              the exit code, when root tags are configured, orphans are found, and enforcement
              is not active.
            justification: |
              Orphaned requirements are a quality signal, not by themselves a build-breaking
              condition, when enforcement has not been explicitly requested. A visible warning
              lets authors notice and fix disconnected requirements during normal development
              without unexpectedly failing builds that have not opted into enforcement. This
              behavior is additionally exercised end-to-end by the tool's self-validation suite
              (`ReqStream_OrphanDetection` in `Validation.cs`), providing qualification evidence
              for downstream deployment environments independent of the xUnit test suite.
            tags: [requirements]
            tests:
              - Program_Run_WithRootTagsAndOrphans_PrintsWarningWithoutFailing
              - Program_Run_WithRootTagsNoOrphans_NoWarningPrinted
              - Program_Run_WithRootTagsDeclaredOnlyInYaml_NoCliFlag_StillChecksOrphans
              - Program_Run_WithCliRootTagsFlagOnly_NoYamlDeclaration_StillChecksOrphans
              - Program_Run_WithNoRootTagsAnywhere_SkipsOrphanCheckEntirely

          - id: ReqStream-Program-OrphanEnforcement
            title: >-
              The tool shall report an error and exit with a non-zero code when enforcement is
              active, root tags are configured, and orphaned requirements are found, regardless
              of whether test result files were supplied.
            justification: |
              Orphan-freedom is a distinct compliance property from test coverage: a requirement
              can be fully tested and still be structurally disconnected from any real product
              need. Enforcing orphan-freedom independently of test-coverage enforcement ensures
              --enforce catches this defect class even in invocations that supply no --tests at
              all, and reports both failure classes together when both apply. This behavior is
              additionally exercised end-to-end by the tool's self-validation suite
              (`ReqStream_OrphanDetection` in `Validation.cs`), providing qualification evidence
              for downstream deployment environments independent of the xUnit test suite.
            tags: [requirements]
            tests:
              - Program_Run_WithEnforcementRootTagsAndOrphansNoTests_FailsEvenWithoutTests
              - Program_Run_WithEnforcementOrphansAndMissingCoverage_ReportsBothErrorBlocks
              - Program_Run_WithEnforcementNoTestsNoRootTags_ReportsNothingToEnforceError
              - Program_Run_WithFilterAndRootTagsOrphans_OrphanCheckIgnoresFilter
              - Program_Run_WithMatrixNoMatchAndEnforceRootTagsOrphan_ReportsBothMatrixAndOrphanErrors
