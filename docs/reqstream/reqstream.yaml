---
# ReqStream system-level requirements
includes:
  - reqstream/cli.yaml
  - reqstream/utilities.yaml
  - reqstream/modeling.yaml
  - reqstream/tracing.yaml
  - reqstream/self-test.yaml
  - reqstream/program.yaml
  - reqstream/platform-requirements.yaml

sections:
  - title: ReqStream Requirements
    sections:
      - title: Functional Requirements
        requirements:
          - id: ReqStream-System-VersionDisplay
            title: >-
              The system shall display version information and exit when the version flag is
              provided.
            justification: |
              Providing the version at the system entry point ensures users and tooling can
              confirm which release is deployed without running the full pipeline.
            tags: [system]
            tests:
              - ReqStream_System_CliInterface_VersionFlag_PrintsVersion
            children:
              - ReqStream-Cli-Interface
              - ReqStream-Program-Version

          - id: ReqStream-System-HelpDisplay
            title: >-
              The system shall display help information and exit when the help flag is provided.
            justification: |
              Providing built-in help at the system entry point enables users to discover
              available flags and options without consulting external documentation.
            tags: [system]
            tests:
              - ReqStream_System_CliInterface_HelpFlag_PrintsHelp
            children:
              - ReqStream-Cli-Interface
              - ReqStream-Program-Help

          - id: ReqStream-System-FullPipeline
            title: >-
              The system shall execute the full requirements-processing pipeline — loading,
              reporting, tracing, and enforcement — in a single invocation.
            justification: |
              Combining requirements processing, test result loading, report generation, and
              enforcement in a single invocation is the primary CI/CD use case. This system-level
              requirement verifies that all subsystems — Modeling, Tracing, and Program —
              work correctly when integrated together.
            tags: [system]
            tests:
              - ReqStream_FullPipeline_WithCoveredRequirements_GeneratesAllReportsAndEnforces
            children:
              - ReqStream-Program-Requirements
              - ReqStream-Modeling-YamlParsing
              - ReqStream-Tracing-TestResults
              - ReqStream-Tracing-Mapping
              - ReqStream-Modeling-Export
              - ReqStream-Tracing-Reporting
              - ReqStream-Tracing-Coverage
              - ReqStream-Cli-MissingArgumentValue

          - id: ReqStream-System-SourceFilter
            title: >-
              The system shall support source-specific test matching to restrict coverage evidence
              to tests from named result files.
            justification: |
              When running tests across multiple platforms or configurations, each producing
              separate test result files, source-specific matching ensures that platform-specific
              requirements are satisfied only by test evidence from the appropriate source files.
            tags: [system]
            tests:
              - ReqStream_SourceFilter_NamedSourceInRequirement_MatchesTestsBySourceFile
            children:
              - ReqStream-Tracing-Coverage

          - id: ReqStream-System-EnforceMode
            title: >-
              The system shall exit with a non-zero code when enforcement mode is active and any
              requirement lacks passing test evidence.
            justification: |
              Enforcement mode makes unproven requirements a build-breaking condition, ensuring
              that the CI/CD pipeline fails if any requirement is not covered by passing tests.
              This validates both the positive case (all requirements satisfied, exit code 0) and
              the negative case (unsatisfied requirement, non-zero exit code).
            tags: [system]
            tests:
              - ReqStream_EnforcementMode_RequirementLacksTestEvidence_FailsWithNonZeroExitCode
            children:
              - ReqStream-Program-Enforce
              - ReqStream-Tracing-Coverage

          - id: ReqStream-System-Lint
            title: >-
              The system shall identify and report all structural issues in requirements files
              during a single linting invocation.
            justification: |
              Linting enables CI/CD pipelines to catch malformed YAML, missing mandatory fields,
              unknown fields, duplicate IDs, and other structural problems early, before they cause
              silent failures in downstream processing.
            tags: [system]
            tests:
              - ReqStream_System_Lint_Flag_ReportsLintIssues
              - ReqStream_System_Lint_ValidRequirementsFile_ExitsSilentlyWithZero
            children:
              - ReqStream-Program-Lint
              - ReqStream-Modeling-Linting
              - ReqStream-Program-LintVerbosity
              - ReqStream-Program-LintNoFiles
              - ReqStream-Program-LintFailure
              - ReqStream-Program-LintNoBanner

          - id: ReqStream-System-Validate
            title: >-
              The system shall run a built-in self-test suite when the validate flag is provided.
            justification: |
              In regulated environments, tool qualification evidence is required to demonstrate that
              the tool functions correctly in its deployment environment. The self-test suite
              exercises core behaviors and produces a pass/fail summary.
            tags: [system]
            tests:
              - ReqStream_System_Validate_Flag_RunsSelfValidation
            children:
              - ReqStream-Program-Validate
              - ReqStream-SelfTest-Qualification
              - ReqStream-SelfTest-FailureReporting-Error
              - ReqStream-SelfTest-FailureReporting-ExitCode

          - id: ReqStream-System-ValidateResultsOutput
            title: >-
              The system shall write self-validation test results to a file when the results flag is
              provided.
            justification: |
              Results file output enables CI/CD pipeline integration and requirements traceability
              tool consumption.
            tags: [system]
            tests:
              - ReqStream_System_ValidateResultsOutput_ResultsFlag_WritesResultsFile
            children:
              - ReqStream-SelfTest-ResultsOutput

          - id: ReqStream-System-RequirementsReport
            title: >-
              The system shall export requirements to a markdown report when the report flag is
              provided.
            justification: |
              Markdown report generation from requirements data enables documentation to be produced
              automatically from requirements files, reducing manual effort and ensuring consistency.
            tags: [system]
            tests:
              - ReqStream_FullPipeline_WithCoveredRequirements_GeneratesAllReportsAndEnforces
            children:
              - ReqStream-Modeling-Export

          - id: ReqStream-System-TraceMatrix
            title: >-
              The system shall export a trace matrix to a markdown report when the matrix flag is
              provided.
            justification: |
              Trace matrix export provides visibility into test coverage and requirement
              satisfaction, essential for quality assurance and compliance reporting.
            tags: [system]
            tests:
              - ReqStream_FullPipeline_WithCoveredRequirements_GeneratesAllReportsAndEnforces
            children:
              - ReqStream-Tracing-Reporting

          - id: ReqStream-System-Justifications
            title: >-
              The system shall export requirement justifications to a markdown report when the
              justifications flag is provided.
            justification: |
              Justification export enables stakeholders to understand the rationale behind
              requirements, supporting design reviews, audits, and compliance activities.
            tags: [system]
            tests:
              - ReqStream_FullPipeline_WithCoveredRequirements_GeneratesAllReportsAndEnforces
            children:
              - ReqStream-Modeling-Export

          - id: ReqStream-System-TagFilter
            title: >-
              The system shall filter requirements output by tags when the filter flag is provided.
            justification: |
              Tag-based filtering enables selective export of requirement subsets for focused
              reports, security audits, compliance documentation, and targeted reviews.
            tags: [system]
            tests:
              - ReqStream_System_TagFilter_Flag_FiltersRequirements
            children:
              - ReqStream-Tracing-Coverage
              - ReqStream-Tracing-Reporting
              - ReqStream-Modeling-Export

          - id: ReqStream-System-LogFileOutput
            title: >-
              The system shall write all output to a log file when the log flag is provided.
            justification: |
              Directing output to a log file enables quiet operation in automated CI/CD pipelines
              and provides a persistent record of tool output for post-run analysis.
            tags: [system]
            tests:
              - ReqStream_System_OutputControl_LogFlag_WritesOutputToFile
              - ReqStream_System_OutputControl_LogFlag_WithoutSilent_WritesOutputToFileAndConsole
            children:
              - ReqStream-Cli-Output
              - ReqStream-Cli-LogFileOpenFailure

          - id: ReqStream-System-SilentMode
            title: >-
              The system shall suppress console output when the silent flag is provided.
            justification: |
              Suppressing console output enables clean integration in CI/CD pipelines where only
              the exit code matters and console output would pollute the build log.
            tags: [system]
            tests:
              - ReqStream_System_OutputControl_SilentFlag_SuppressesConsoleOutput
            children:
              - ReqStream-Cli-Output
              - ReqStream-Cli-StderrRouting
              - ReqStream-Cli-ExitCodeSignaling

          - id: ReqStream-System-ReportDepth
            title: >-
              The system shall support configurable report heading depth via command-line flags.
            justification: |
              Depth options allow control over Markdown heading levels in exported reports,
              enabling integration with external document workflows that require specific
              heading hierarchies. A single --depth flag sets the default for all report types,
              with per-report overrides available for fine-grained control.
            tags: [system]
            tests:
              - ReqStream_System_ReportDepth_DepthFlag_GeneratesReportWithCorrectHeadingLevel
            children:
              - ReqStream-Cli-InvalidDepthValue
              - ReqStream-Cli-DepthInheritance

          - id: ReqStream-System-CrossPlatform
            title: >-
              The system shall run on supported operating systems and .NET runtime versions.
            justification: |
              Cross-platform support ensures the tool can be used in diverse development
              environments including Windows, Linux, and macOS, and across the supported .NET
              LTS and current releases. The CI matrix validates this on every build.
              This requirement is satisfied by its children: each child carries source-filtered
              test references from the CI matrix job, scoped to the specific platform or runtime
              it represents. Satisfaction of all children constitutes complete evidence for this
              system-level requirement.
            tags: [system]
            children:
              - ReqStream-Platform-Windows
              - ReqStream-Platform-Linux
              - ReqStream-Platform-MacOS
              - ReqStream-Platform-Net8
              - ReqStream-Platform-Net9
              - ReqStream-Platform-Net10

          - id: ReqStream-System-FileIncludes
            title: >-
              The system shall support loading requirements from multiple YAML files via file
              includes, enabling modular requirements management.
            justification: |
              File includes allow requirements to be split across multiple YAML files organized
              by component, team, or release, while still producing a single unified requirements
              tree. This is essential for scalable requirements management in large repositories.
            tags: [system]
            tests:
              - ReqStream_System_FileIncludes_RequirementsWithIncludes_LoadsAllRequirements
            children:
              - ReqStream-Requirements-Includes
              - ReqStream-Modeling-MultiFileLoading

          - id: ReqStream-System-SectionMerging
            title: >-
              The system shall automatically merge sections with the same hierarchy path
              when loading requirements from multiple YAML files.
            justification: |
              Title-based section merging enables modular requirements management without any
              explicit namespace or import declaration. Multiple files can contribute to the same
              logical section, allowing requirements to be organized by feature, component, or
              responsibility while still producing one coherent requirement tree.
            tags: [system]
            tests:
              - ReqStream_System_SectionMerging_TwoFilesWithSameSection_ProducesSingleMergedSection
            children:
              - ReqStream-Requirements-SectionMerging
              - ReqStream-Section-TitleMerging

          - id: ReqStream-System-CircularIncludeDetection
            title: >-
              The system shall detect and report circular include references in requirements
              files.
            justification: |
              Circular includes (A includes B, B includes A) would cause infinite loading loops.
              Detecting and reporting them prevents hangs and provides users with a clear error
              message identifying the problematic file.
            tags: [system]
            tests:
              - ReqStream_System_CircularIncludeDetection_CircularInclude_ReportsError
            children:
              - ReqStream-Requirements-CircularInclude

          - id: ReqStream-System-TestFileErrorHandling
            title: >-
              The system shall report a fatal error when a test result file is missing or
              cannot be parsed.
            justification: |
              Missing or malformed test result files indicate a misconfiguration or broken
              CI pipeline step. Reporting a clear fatal error prevents silent data loss and
              allows users to diagnose the problem quickly.
              Satisfaction of all children constitutes complete evidence for this
              system-level requirement.
            tags: [system]
            tests:
              - ReqStream_System_TestFileErrorHandling_MissingTestFile_ReportsFatalError
              - ReqStream_System_TestFileErrorHandling_MalformedTestFile_ReportsFatalError
            children:
              - ReqStream-Tracing-MissingFile
              - ReqStream-Tracing-MalformedFile

          - id: ReqStream-System-MatrixErrorHandling
            title: >-
              The system shall report an error when a trace matrix is requested but no test
              result files are provided.
            justification: |
              Requesting a matrix without providing test files is a user configuration error.
              Reporting a clear error prevents silent failures and guides users to provide the
              required test result files.
              Satisfaction of all children constitutes complete evidence for this
              system-level requirement.
            tags: [system]
            tests:
              - ReqStream_System_MatrixErrorHandling_MatrixWithoutTests_ReportsError
            children:
              - ReqStream-Program-MatrixNoTests

          - id: ReqStream-System-EnforceNoTests
            title: >-
              The system shall report an error when enforcement is requested but no test result
              files are provided.
            justification: |
              Enforcement without test results is a configuration error analogous to
              requesting a trace matrix without test results. The user should be informed
              explicitly rather than silently succeeding or failing.
            tags: [system]
            tests:
              - ReqStream_System_EnforceNoTests_EnforceWithoutTests_ReportsError
            children:
              - ReqStream-Program-Enforce

          - id: ReqStream-System-CyclicChildDetection
            title: >-
              The system shall detect and report cyclic references in the child-requirement
              graph before any downstream analysis.
            justification: |
              Cyclic requirement hierarchies would cause infinite recursion in trace matrix
              generation. Detecting and reporting all cycles before any analysis begins ensures
              downstream processing is safe. This corresponds to the ValidateCycles measure
              described in the Risk Control Measures section of the design document.
              Satisfaction of all children constitutes complete evidence for this
              system-level requirement.
            tags: [system]
            tests:
              - ReqStream_System_CyclicChildDetection_CyclicChildRequirements_ReportsError
            children:
              - ReqStream-Lint-CircularReferences
