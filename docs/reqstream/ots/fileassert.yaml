---
# FileAssert OTS requirements
# Note: Requirement IDs in OTS files use the project-wide ReqStream-OTS-{ToolName} pattern,
# which is an accepted deviation from the System-Component-Feature naming standard defined
# in reqstream-usage.md. Renaming would break traceability across all test files.
sections:
  - title: OTS Software Requirements
    sections:
      - title: FileAssert
        requirements:
          # Note: ID uses the project-wide ReqStream-OTS-{ToolName} pattern (accepted deviation
          # from the System-Component-Feature standard; renaming would break test file traceability).
          - id: ReqStream-OTS-FileAssert
            title: FileAssert shall validate generated documents against acceptance criteria.
            justification: |
              DemaConsulting.FileAssert validates HTML and PDF documents produced during the
              build, asserting that each document exists, has a non-trivial size, is structurally
              valid, and contains expected content. It provides OTS evidence for Pandoc and
              WeasyPrint and independently confirms file assertion is functioning. Self-validation
              proves the tool itself is operational before ReqStream consumes the results.
            tags: [ots]
            tests:
              - FileAssert_VersionDisplay
              - FileAssert_HelpDisplay
              - Pandoc_DesignHtml
