---
# ReviewMark OTS requirements
# Note: Requirement IDs in OTS files use the project-wide ReqStream-OTS-{ToolName} pattern,
# which is an accepted deviation from the System-Component-Feature naming standard defined
# in reqstream-usage.md. Renaming would break traceability across all test files.
sections:
  - title: OTS Software Requirements
    sections:
      - title: ReviewMark
        requirements:
          - id: ReqStream-OTS-ReviewMark-Plan
            title: ReviewMark shall generate review plans.
            justification: |
              DemaConsulting.ReviewMark reads the .reviewmark.yaml configuration and the review
              evidence store to produce a review plan documenting file review coverage and
              currency. ReviewMark is qualified via its built-in --validate command, which runs
              internal self-tests and writes results to a TRX file consumed by ReqStream as
              traceability evidence.
            tags: [ots]
            tests:
              - ReviewMark_ReviewPlanGeneration
          - id: ReqStream-OTS-ReviewMark-Report
            title: ReviewMark shall generate review reports.
            justification: |
              DemaConsulting.ReviewMark reads the .reviewmark.yaml configuration and the review
              evidence store to produce a review report documenting file review coverage and
              currency. ReviewMark is qualified via its built-in --validate command, which runs
              internal self-tests and writes results to a TRX file consumed by ReqStream as
              traceability evidence.
            tags: [ots]
            tests:
              - ReviewMark_ReviewReportGeneration
