---
# BuildMark OTS requirements
# Note: Requirement IDs in OTS files use the project-wide ReqStream-OTS-{ToolName} pattern,
# which is an accepted deviation from the System-Component-Feature naming standard defined
# in reqstream-usage.md. Renaming would break traceability across all test files.
# Note: The 'tags' field is a supported ReqStream extension field used for categorization.
# It is silently accepted by ReqStream and does not affect report generation or validation.
sections:
  - title: OTS Software Requirements
    sections:
      - title: BuildMark
        requirements:
          - id: ReqStream-OTS-BuildMark
            title: BuildMark shall generate build-notes documentation from GitHub Actions metadata.
            justification: |
              DemaConsulting.BuildMark queries the GitHub API to capture workflow run details and
              renders them as a markdown build-notes document included in the release artifacts.
              It runs as part of the same CI pipeline that produces the TRX test results, so a
              successful pipeline run is evidence that BuildMark executed without error.
            tags: [ots]
            tests:
              - BuildMark_MarkdownReportGeneration
