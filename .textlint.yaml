---
# Spell-Checking with TextLint
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: '0.2'

language: en

# The files to spell-check
files:
  - "**/*.{md,yaml,yml,json,cs,cpp,hpp,h,txt}"
# Matches the previous spell checker, which also checks hidden paths such as .github/
enableGlobDot: true

# Project-specific technical terms and tool names
words:
  - APFS
  - callees
  - consoleloggerparameters
  - dema
  - Dema
  - DEMA
  - demaconsulting
  - ncipollo
  - nestings
  - netstandard
  - RAII
  - retag
  - SARIF
  - sarif
  - Sarif
  - shopt
  - slnx
  - snupkg
  - sonarscanner
  - testname
  - thirdparty
  - tracematrix
  - unidirectionality
  - unloadable
  - unparseable
  - venv
  - yamldotnet
  - yamlfix

ignorePaths:
  - '**/.git/**'
  - '**/node_modules/**'
  - '**/.venv/**'
  - '**/thirdparty/**'
  - '**/third-party/**'
  - '**/3rd-party/**'
  - '**/generated/**'
  - '**/.agent-logs/**'
  - '**/bin/**'
  - '**/obj/**'
  - package-lock.json
