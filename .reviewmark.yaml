---
# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets following software unit boundaries.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "**/*.cs"                    # All C# source and test files
  - "docs/reqstream/**/*.yaml"   # Requirements files
  - "docs/design/**/*.md"        # Design documents
  - "!**/obj/**"                 # Exclude build output
  - "!**/bin/**"                 # Exclude build output

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
# Note: The 'reviews' branch must be created and populated with review evidence PDFs
# and an index.json before enforcement (--enforce flag) can be enabled in the pipeline.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/ReqStream/reviews/index.json

# Review sets grouping files by logical unit of review.
# Each review-set groups requirements, source, and tests for a coherent software unit
# so that an AI-assisted review can verify consistency across the full evidence chain.
reviews:
  # System-level review — requirements, design, integration tests, and platform support
  - id: ReqStream-System
    title: Review of ReqStream System-Level Design and Requirements
    paths:
      - "docs/reqstream/reqstream-system.yaml"
      - "docs/reqstream/platform-requirements.yaml"
      - "docs/design/introduction.md"
      - "docs/design/system.md"
      - "test/**/IntegrationTests.cs"

  # Design review — system-level requirements traced against the complete design
  - id: ReqStream-Design
    title: Review of ReqStream Design Against Requirements
    paths:
      - "docs/reqstream/reqstream-system.yaml"
      - "docs/reqstream/platform-requirements.yaml"
      - "docs/design/**/*.md"

  # Software unit reviews - one per class
  - id: ReqStream-Context
    title: Review of ReqStream Context Unit
    paths:
      - "docs/reqstream/unit-context.yaml"
      - "docs/design/context.md"
      - "src/**/Cli/Context.cs"
      - "test/**/Cli/ContextTests.cs"

  - id: ReqStream-Program
    title: Review of ReqStream Program Unit
    paths:
      - "docs/reqstream/unit-program.yaml"
      - "docs/design/program.md"
      - "src/**/Program.cs"
      - "test/**/ProgramTests.cs"

  - id: ReqStream-Validation
    title: Review of ReqStream Validation Unit
    paths:
      - "docs/reqstream/unit-validation.yaml"
      - "docs/design/validation.md"
      - "src/**/Validation/Validation.cs"
      - "test/**/Validation/ValidationTests.cs"

  - id: ReqStream-Requirements
    title: Review of ReqStream Requirements Unit
    paths:
      - "docs/reqstream/unit-requirements.yaml"
      - "docs/design/requirements.md"
      - "src/**/Requirements/Requirement.cs"
      - "src/**/Requirements/Requirements.cs"
      - "src/**/Requirements/Section.cs"
      - "test/**/Requirements/RequirementsReadTests.cs"
      - "test/**/Requirements/RequirementsExportTests.cs"

  - id: ReqStream-TraceMatrix
    title: Review of ReqStream TraceMatrix Unit
    paths:
      - "docs/reqstream/unit-trace-matrix.yaml"
      - "docs/design/tracematrix.md"
      - "src/**/Tracing/TraceMatrix.cs"
      - "test/**/Tracing/TraceMatrixTests.cs"
      - "test/**/Tracing/TraceMatrixReadTests.cs"
      - "test/**/Tracing/TraceMatrixExportTests.cs"

  - id: ReqStream-Linter
    title: Review of ReqStream Linter Unit
    paths:
      - "docs/reqstream/unit-linter.yaml"
      - "docs/design/linter.md"
      - "src/**/Linting/Linter.cs"
      - "test/**/Linting/LinterTests.cs"

  # Full requirements review — all requirements files reviewed together for completeness and consistency
  - id: ReqStream-AllRequirements
    title: Review of All ReqStream Requirements for Consistency
    paths:
      - "docs/reqstream/**/*.yaml"
