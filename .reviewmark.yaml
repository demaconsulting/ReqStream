---
# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets following hierarchical scope principles.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "README.md"                   # Root README file
  - "requirements.yaml"           # Root requirements file
  - "**/*.cs"                     # All C# source and test files
  - "docs/reqstream/**/*.yaml"    # Requirements files
  - "docs/design/**/*.md"         # Design documentation files
  - "docs/verification/**/*.md"   # Verification documentation files
  - "docs/user_guide/**/*.md"     # User guide documentation
  - "!**/obj/**"                  # Exclude build output
  - "!**/bin/**"                  # Exclude build output
  - "!node_modules/**"            # Exclude npm dependencies
  - "!**/.venv/**"                # Exclude Python virtual environment

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
# Note: The 'reviews' branch must be created and populated with review evidence PDFs
# and an index.json before enforcement (--enforce flag) can be enabled in the pipeline.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/ReqStream/reviews/index.json

# Review sets following standardized patterns for hierarchical compliance coverage
reviews:
  # Purpose Review (only one per repository)
  - id: Purpose
    title: Review that Advertised Features Match System Design
    paths:
      - "README.md"                                         # user-facing documentation
      - "docs/user_guide/**/*.md"                           # user guide
      - "docs/reqstream/reqstream/reqstream.yaml"           # system requirements
      - "docs/design/introduction.md"                       # design introduction
      - "docs/design/reqstream/reqstream.md"                # system design

  # ReqStream-Architecture Review (one per system)
  - id: ReqStream-Architecture
    title: Review that ReqStream Architecture Satisfies Requirements
    paths:
      - "docs/reqstream/reqstream/reqstream.yaml"           # system requirements
      - "docs/design/introduction.md"                       # design introduction
      - "docs/design/reqstream/reqstream.md"                # system design
      - "test/**/IntegrationTests.cs"                       # system integration tests
      - "test/**/Runner.cs"                                 # test runner infrastructure
      - "test/**/AssemblyInfo.cs"                           # test infrastructure

  # ReqStream-Design Review (one per system)
  - id: ReqStream-Design
    title: Review that ReqStream Design is Consistent and Complete
    paths:
      - "docs/reqstream/reqstream/reqstream.yaml"           # system requirements
      - "docs/reqstream/reqstream/platform-requirements.yaml"  # platform requirements
      - "docs/design/introduction.md"                       # design introduction
      - "docs/design/reqstream/**/*.md"                     # all system design documents

  # ReqStream-AllRequirements Review (one per system)
  - id: ReqStream-AllRequirements
    title: Review that All ReqStream Requirements are Complete
    paths:
      - "requirements.yaml"                                 # root requirements file
      - "docs/reqstream/reqstream/**/*.yaml"                # all system requirements files
      - "docs/reqstream/ots/**/*.yaml"                      # OTS requirements files

  # ReqStream-Cli Review (one per subsystem)
  - id: ReqStream-Cli
    title: Review that ReqStream Cli Satisfies Subsystem Requirements
    paths:
      - "docs/reqstream/reqstream/cli/cli.yaml"             # subsystem requirements
      - "docs/design/reqstream/cli/cli.md"                  # subsystem design
      - "test/**/Cli/CliTests.cs"                          # subsystem tests

  - id: ReqStream-Modeling
    title: Review that ReqStream Modeling Satisfies Subsystem Requirements
    paths:
      - "docs/reqstream/reqstream/modeling/modeling.yaml"   # subsystem requirements
      - "docs/design/reqstream/modeling/modeling.md"        # subsystem design
      - "test/**/Modeling/ModelingTests.cs"                # subsystem tests

  - id: ReqStream-Tracing
    title: Review that ReqStream Tracing Satisfies Subsystem Requirements
    paths:
      - "docs/reqstream/reqstream/tracing/tracing.yaml"     # subsystem requirements
      - "docs/design/reqstream/tracing/tracing.md"          # subsystem design
      - "test/**/Tracing/TracingTests.cs"                  # subsystem tests

  - id: ReqStream-SelfTest
    title: Review that ReqStream SelfTest Satisfies Subsystem Requirements
    paths:
      - "docs/reqstream/reqstream/self-test/self-test.yaml"  # subsystem requirements
      - "docs/design/reqstream/self-test/self-test.md"      # subsystem design
      - "test/**/SelfTest/SelfTestTests.cs"                # subsystem tests

  # ── Unit Reviews ──────────────────────────────────────────────────────────────
  - id: ReqStream-Program
    title: Review that ReqStream Program Implementation is Correct
    paths:
      - "docs/reqstream/reqstream/program.yaml"             # unit requirements
      - "docs/design/reqstream/program.md"                  # unit design
      - "src/**/Program.cs"                                 # implementation
      - "test/**/ProgramTests.cs"                           # unit tests

  - id: ReqStream-Cli-Context
    title: Review that ReqStream Cli Context Implementation is Correct
    paths:
      - "docs/reqstream/reqstream/cli/context.yaml"         # unit requirements
      - "docs/design/reqstream/cli/context.md"              # unit design
      - "src/**/Cli/Context.cs"                             # implementation
      - "test/**/Cli/ContextTests.cs"                       # unit tests

  - id: ReqStream-Modeling-LintIssue
    title: Review that ReqStream Modeling LintIssue Implementation is Correct
    paths:
      - "docs/reqstream/reqstream/modeling/lint-issue.yaml"     # unit requirements
      - "docs/design/reqstream/modeling/lint-issue.md"          # unit design
      - "src/**/Modeling/LintIssue.cs"                          # implementation
      - "test/**/Modeling/LintIssueTests.cs"                    # unit tests

  - id: ReqStream-Modeling-LoadResult
    title: Review that ReqStream Modeling LoadResult Implementation is Correct
    paths:
      - "docs/reqstream/reqstream/modeling/load-result.yaml"    # unit requirements
      - "docs/design/reqstream/modeling/load-result.md"         # unit design
      - "src/**/Modeling/LoadResult.cs"                         # implementation
      - "test/**/Modeling/LoadResultTests.cs"                   # unit tests
      - "test/**/Modeling/RequirementsLoadTests.cs"             # load result integration tests

  - id: ReqStream-Modeling-Requirement
    title: Review that ReqStream Modeling Requirement Implementation is Correct
    paths:
      - "docs/reqstream/reqstream/modeling/requirement.yaml"    # unit requirements
      - "docs/design/reqstream/modeling/requirement.md"         # unit design
      - "src/**/Modeling/Requirement.cs"                        # implementation
      - "test/**/Modeling/RequirementTests.cs"                  # unit tests

  - id: ReqStream-Modeling-Requirements
    title: Review that ReqStream Modeling Requirements Implementation is Correct
    paths:
      - "docs/reqstream/reqstream/modeling/requirements.yaml"   # unit requirements
      - "docs/design/reqstream/modeling/requirements.md"        # unit design
      - "src/**/Modeling/Requirements.cs"                       # implementation
      - "test/**/Modeling/RequirementsLoadTests.cs"             # unit tests
      - "test/**/Modeling/RequirementsLoadParsingTests.cs"      # unit tests
      - "test/**/Modeling/RequirementsExportTests.cs"           # unit tests

  - id: ReqStream-Modeling-RequirementsLoader
    title: Review that ReqStream Modeling RequirementsLoader Implementation is Correct
    paths:
      - "docs/reqstream/reqstream/modeling/requirements-loader.yaml"  # unit requirements
      - "docs/design/reqstream/modeling/requirements-loader.md"       # unit design
      - "src/**/Modeling/RequirementsLoader.cs"                       # implementation
      - "test/**/Modeling/RequirementsLoaderTests.cs"                 # unit tests

  - id: ReqStream-Modeling-Section
    title: Review that ReqStream Modeling Section Implementation is Correct
    paths:
      - "docs/reqstream/reqstream/modeling/section.yaml"        # unit requirements
      - "docs/design/reqstream/modeling/section.md"             # unit design
      - "src/**/Modeling/Section.cs"                            # implementation
      - "test/**/Modeling/SectionTests.cs"                      # unit tests
      - "test/**/Modeling/RequirementsExportTests.cs"           # section hierarchy export tests

  - id: ReqStream-Tracing-TraceMatrix
    title: Review that ReqStream Tracing TraceMatrix Implementation is Correct
    paths:
      - "docs/reqstream/reqstream/tracing/trace-matrix.yaml"  # unit requirements
      - "docs/design/reqstream/tracing/trace-matrix.md"     # unit design
      - "src/**/Tracing/TraceMatrix.cs"                     # implementation
      - "test/**/Tracing/TraceMatrixTests.cs"               # unit tests
      - "test/**/Tracing/TraceMatrixReadTests.cs"           # unit tests
      - "test/**/Tracing/TraceMatrixExportTests.cs"         # unit tests

  - id: ReqStream-SelfTest-Validation
    title: Review that ReqStream SelfTest Validation Implementation is Correct
    paths:
      - "docs/reqstream/reqstream/self-test/validation.yaml"  # unit requirements
      - "docs/design/reqstream/self-test/validation.md"     # unit design
      - "src/**/SelfTest/Validation.cs"                     # implementation
      - "test/**/SelfTest/ValidationTests.cs"               # unit tests
